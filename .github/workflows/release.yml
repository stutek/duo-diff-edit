# A tag v<version> publishes a GitHub release with the .vsix and its SHA-256, after every check passed.
# Building (with the npm install of Claude Code) runs with a read-only token; only the publish job, which installs
# nothing, may write. The build is reproducible: python3 scripts/build-vsix.py on the tag gives the same .vsix on Linux.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm install --global @anthropic-ai/claude-code@2.1.318
      - run: python scripts/check.py --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: |
            dist/*.vsix
            dist/*.vsix.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the release; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist
      - name: Verify the checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum --check ./*.sha256)
          gh release create "$GITHUB_REF_NAME" dist/*.vsix dist/*.vsix.sha256 --verify-tag --generate-notes --title "Duo Diff Edit $GITHUB_REF_NAME"
